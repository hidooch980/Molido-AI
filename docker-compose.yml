# =============================================
# Molido AI — اجرای کامل با Docker
#
# راه‌اندازی:  ./setup.sh   (لینوکس/مک)   یا   setup.ps1   (ویندوز)
# دستی:        cp .env.example .env  →  ویرایش  →  docker compose up -d
#
# پورت‌ها با BACKEND_PORT / WEB_PORT / N8N_PORT در .env قابل تغییرند؛ اگر روی
# این دستگاه سرویس دیگری همان پورت را گرفته باشد، فقط همین‌ها را عوض کنید.
#
# ⚠️ برای استفادهٔ تحت شبکه، HOST_IP باید نشانی سرور در شبکهٔ محلی باشد،
#    نه localhost — وگرنه صندوق‌های روی دستگاه‌های دیگر به سرور وصل نمی‌شوند.
#    اسکریپت راه‌اندازی این را خودکار تشخیص می‌دهد.
# =============================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-molido_ai}
    # فقط از داخل شبکهٔ داکر در دسترس است؛ دیتابیس نباید روی LAN باز باشد.
    # برای اتصال ابزار مدیریت از همین دستگاه، این خط را از حالت توضیح خارج کنید:
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - molido_net

  # اجرای یک‌بارهٔ migrationها پیش از بالا آمدن بک‌اند.  با این کار به‌روزرسانی
  # نسخه فقط `docker compose up -d` است و مرحلهٔ دستی ندارد.
  migrate:
    # همان image بک‌اند، با نام صریح؛ اگر هر سرویس image خودش را بسازد،
    # `docker compose build backend` این یکی را قدیمی باقی می‌گذارد و
    # migration تازه اجرا نمی‌شود.
    image: molido-backend:latest
    build: ./backend
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # اجزای جداگانه، نه URL: رمز قوی معمولاً @ یا # دارد و تجزیهٔ URL را
      # می‌شکند — با خطایی گمراه‌کننده دربارهٔ میزبان، نه دربارهٔ رمز.
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-password}
      PGDATABASE: ${POSTGRES_DB:-molido_ai}
      # نقش برنامه: مهاجرت آن را می‌سازد و رمزش را با این مقدار همگام
      # می‌کند.  بدون این، تغییر APP_DB_PASSWORD در .env اتصال بک‌اند را با
      # خطای احراز هویت می‌شکست چون رمز نقش قدیمی می‌ماند.
      APP_DB_USER: ${APP_DB_USER:-molido_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-molido_app_local}
    # image نهایی فقط dist دارد؛ tsx و src در آن نیستند.
    command: ["node", "dist/database/migrate.js"]
    networks:
      - molido_net

  backend:
    image: molido-backend:latest
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      NODE_ENV: production
      # کدام محصول: store | resto | suite
      MOLIDO_PRODUCT: ${MOLIDO_PRODUCT:-suite}
      # اجزای جداگانه، نه URL: رمز قوی معمولاً @ یا # دارد و تجزیهٔ URL را
      # می‌شکند — با خطایی گمراه‌کننده دربارهٔ میزبان، نه دربارهٔ رمز.
      PGHOST: postgres
      PGPORT: 5432
      # برنامه با نقش محدود وصل می‌شود تا Row Level Security بر او اعمال
      # شود؛ نقش صاحب جدول‌ها طبق پیش‌فرض PostgreSQL از RLS معاف است و اگر
      # برنامه با آن وصل شود، جداسازی شرکت‌ها بی‌اثر می‌ماند.
      PGUSER: ${APP_DB_USER:-molido_app}
      PGPASSWORD: ${APP_DB_PASSWORD:-molido_app_local}
      PGDATABASE: ${POSTGRES_DB:-molido_ai}
      # رمز مدیر برای `seed`.  بودنش در .env کافی نیست: آن فقط برای
      # جای‌گذاری در همین فایل است، نه محیط داخل کانتینر — و seed دقیقاً
      # داخل کانتینر اجرا می‌شود.  نبودن این خط باعث شد نصب سرور با رمز
      # پیش‌فرض بالا بیاید در حالی که اسکریپت رمز قوی ساخته بود.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # داده اولیه باید روی همهٔ شرکت‌ها کار کند، پس با نقش صاحب اجرا می‌شود.
      PGADMIN_USER: ${POSTGRES_USER:-postgres}
      PGADMIN_PASSWORD: ${POSTGRES_PASSWORD:-password}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET الزامی است — setup.sh را اجرا کنید}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET الزامی است}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      # صندوق‌های روی شبکه از نشانی سرور می‌آیند، نه localhost
      CORS_ORIGIN: ${CORS_ORIGIN:-http://${HOST_IP:-localhost}:${WEB_PORT:-3001}}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-20000}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER: ${SMS_SENDER:-10008663}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-molido_n8n_secret}
      N8N_BASE_URL: http://n8n:5678
      # ⚠️ همان دامِ `ADMIN_PASSWORD` بالا، برای درگاهِ پرداخت.
      #    بودنشان در `.env.example` هیچ اثری ندارد: `.env` فقط برای
      #    جای‌گذاری در همین فایل خوانده می‌شود، نه محیطِ داخلِ کانتینر.
      #    بدونِ این دو خط، `ZARINPAL_MERCHANT_ID` همیشه تهی است و
      #    پرداختِ آنلاین در تولید خطا می‌دهد — درست وقتی مشتری وسطِ
      #    خرید است.
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-false}
      # فقط برای آزمون؛ در تولید تنظیم نمی‌شود.
      ZARINPAL_BASE_URL: ${ZARINPAL_BASE_URL:-}
      # سامانه شاهکار — بدون این خطوط، متغیرها مستند ولی بی‌اثرند.
      SHAHKAR_URL: ${SHAHKAR_URL:-}
      SHAHKAR_TOKEN: ${SHAHKAR_TOKEN:-}
      SHAHKAR_PROVIDER: ${SHAHKAR_PROVIDER:-}
      SHAHKAR_METHOD: ${SHAHKAR_METHOD:-}
      SHAHKAR_AUTH_SCHEME: ${SHAHKAR_AUTH_SCHEME:-}
      SHAHKAR_FIELD_NID: ${SHAHKAR_FIELD_NID:-}
      SHAHKAR_FIELD_MOBILE: ${SHAHKAR_FIELD_MOBILE:-}
      SHAHKAR_PATH_MATCHED: ${SHAHKAR_PATH_MATCHED:-}
      SHAHKAR_PATH_REFERENCE: ${SHAHKAR_PATH_REFERENCE:-}
      SHAHKAR_TIMEOUT_MS: ${SHAHKAR_TIMEOUT_MS:-}
      SHAHKAR_ENFORCE: ${SHAHKAR_ENFORCE:-}
      SHAHKAR_ON_ERROR: ${SHAHKAR_ON_ERROR:-}
      # ⚠️ نشانیِ عمومیِ **API** — بازگشتِ درگاه به همین‌جا می‌آید.
      #
      #    بدونش `siteBase()` به `localhost:3000` برمی‌گردد و درگاه
      #    کاربر را به نشانی‌ای می‌فرستد که از اینترنت وجود ندارد —
      #    یعنی پول کسر می‌شود و سفارش `PENDING` می‌ماند.
      #
      #    سومین بار است که همین دام تکرار می‌شود (`ADMIN_PASSWORD`،
      #    `ZARINPAL_*`، حالا این).  الگو روشن است: هر متغیری که در
      #    `.env.example` مستند شود باید همین‌جا هم پاس شود.
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}
      # نشانیِ عمومیِ سایت — بازگشتِ درگاه به همین‌جا برمی‌گردد.
      SITE_URL: ${SITE_URL:-http://${HOST_IP:-localhost}:${WEB_PORT:-3001}}
      # ⚠️ همان دامِ `ADMIN_PASSWORD` و `ZARINPAL_*`: بودن در `.env`
      #    کافی نیست، باید صریح به کانتینر پاس شود.
      GOV_SSO_CLIENT_ID: ${GOV_SSO_CLIENT_ID:-}
      GOV_SSO_CLIENT_SECRET: ${GOV_SSO_CLIENT_SECRET:-}
      GOV_SSO_AUTHORIZE_URL: ${GOV_SSO_AUTHORIZE_URL:-}
      GOV_SSO_TOKEN_URL: ${GOV_SSO_TOKEN_URL:-}
      GOV_SSO_USERINFO_URL: ${GOV_SSO_USERINFO_URL:-}
      GOV_SSO_REDIRECT_URI: ${GOV_SSO_REDIRECT_URI:-}
      GOV_SSO_SCOPE: ${GOV_SSO_SCOPE:-openid profile}
      GOV_SSO_TIMEOUT_MS: ${GOV_SSO_TIMEOUT_MS:-15000}
      # شرکتِ مقصد برای مسیرهای عمومی (فروشگاه و ورودِ شهروند).
      SHOP_COMPANY_ID: ${SHOP_COMPANY_ID:-}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - molido_net

  web:
    build:
      context: ./web
      args:
        # در Next.js متغیر NEXT_PUBLIC_ هنگام build داخل کد جاسازی می‌شود،
        # بنابراین تغییر نشانی سرور نیاز به build دوباره دارد.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://${HOST_IP:-localhost}:${BACKEND_PORT:-3000}}
        # وب باید همان محصولی را بشناسد که بک‌اند بالا آورده
        NEXT_PUBLIC_MOLIDO_PRODUCT: ${MOLIDO_PRODUCT:-suite}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # سرور Next داخل شبکهٔ داکر اجرا می‌شود و باید بک‌اند را با نام
      # سرویس صدا بزند؛ NEXT_PUBLIC_API_URL نشانیِ قابل دسترس از مرورگر
      # است و از داخل کانتینر لزوماً کار نمی‌کند.
      INTERNAL_API_URL: http://backend:3000
      # ⚠️ `robots.ts` و `sitemap.ts` این را در **زمانِ اجرا** می‌خوانند
      #    (پیش از `NEXT_PUBLIC_SITE_URL` که در زمانِ ساخت جا می‌افتد).
      #    نبودنش یعنی نقشهٔ سایت با نشانیِ localhost منتشر می‌شود.
      SITE_URL: ${SITE_URL:-http://${HOST_IP:-localhost}:${WEB_PORT:-3001}}
    ports:
      - "${WEB_PORT:-3001}:3001"
    networks:
      - molido_net

  # ورکفلوها باید خودکار وارد شوند.  README می‌گفت «کافی است Import کنید»،
  # ولی این یک مرحلهٔ دستی است که روی سرور مشتری هیچ‌کس انجامش نمی‌دهد —
  # نتیجه‌اش n8n خالی بود در حالی که مستندات وعدهٔ اتوماسیون می‌داد.
  #
  # قبل از n8n اصلی اجرا می‌شود، نه بعدش: نمونهٔ در حال اجرا قفل مهاجرت
  # دیتابیس را نگه می‌دارد و import پشت آن می‌ماند.
  n8n-import:
    image: n8nio/n8n:latest
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-postgres}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      N8N_DIAGNOSTICS_ENABLED: "false"
    entrypoint: ["n8n", "import:workflow", "--separate", "--input=/workflows"]
    volumes:
      - ./n8n-workflows:/workflows:ro
    networks:
      - molido_net

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      # وگرنه هر دو همزمان مهاجرت می‌زنند و import پشت قفل می‌ماند
      n8n-import:
        condition: service_completed_successfully
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-postgres}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      WEBHOOK_URL: http://${HOST_IP:-localhost}:${N8N_PORT:-5678}/
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:?N8N_PASSWORD الزامی است}
      MOLIDO_API_URL: http://backend:3000
      MOLIDO_API_SECRET: ${N8N_WEBHOOK_SECRET:-molido_n8n_secret}
      N8N_DIAGNOSTICS_ENABLED: "false"
    # ⚠️ پیش‌فرض **فقط لوکال‌هاست**، نه کلِ شبکه.
    #
    #    n8n نسخهٔ ۱ به بعد `N8N_BASIC_AUTH_*` را **نادیده می‌گیرد**
    #    (در ۱.۰ حذف شد) و به‌جایش «مدیریت کاربر» دارد.  ولی تا وقتی
    #    کسی حسابِ مالک را نساخته، پنل **کاملاً باز** است:
    #
    #      GET /               → ۲۰۰   (نه ۴۰۱)
    #      GET /rest/settings  → ۲۰۰   showSetupOnFirstLoad: true
    #
    #    یعنی در یک نصبِ فروشگاهی، هر کسی روی وای‌فای که اول به
    #    `http://<ip>:5678` برسد **مالک می‌شود** — و n8n اعتبارنامهٔ
    #    پایگاه داده و کلیدهای API را در خودش دارد.
    #
    #    تنظیمات `N8N_BASIC_AUTH_ACTIVE` بالا باقی می‌ماند چون برای
    #    نسخه‌های قدیمی‌تر بی‌ضرر است، ولی **به آن تکیه نمی‌شود**.
    #
    #    n8n ابزارِ مدیر است، نه ابزارِ صندوق‌دار؛ صحافیِ لوکال‌هاست
    #    هیچ کارِ روزمره‌ای را نمی‌شکند.  برای دسترسی از بیرون:
    #    `N8N_BIND=0.0.0.0` — ولی **فقط پس از ساختِ حسابِ مالک**.
    ports:
      - "${N8N_BIND:-127.0.0.1}:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - molido_net

  # پشتیبان‌گیری خودکار شبانه.  بدون این، یک خرابی دیسک یعنی از دست رفتن
  # کل دفاتر مالی — و در استقرار لوکال هیچ نسخهٔ ابری‌ای در کار نیست.
  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-password}
      PGDATABASE: ${POSTGRES_DB:-molido_ai}
      BACKUP_CRON: ${BACKUP_CRON:-17 2 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-8}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-12}
      TZ: ${TZ:-Asia/Tehran}
    volumes:
      - backup_data:/backups
    networks:
      - molido_net

volumes:
  postgres_data:
  backup_data:
  uploads_data:
  n8n_data:

networks:
  molido_net:
    driver: bridge
