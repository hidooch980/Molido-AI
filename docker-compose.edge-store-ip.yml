# اتصالِ فروشگاه به لبهٔ مشترک — **بدونِ زیردامنه**.
#
# ⚠️ چرا کنارِ `docker-compose.edge-store.yml` و نه به‌جایش:
#
#    آن فایل هویتِ فروشگاه را به `MOLIDO_HOST_STORE` گره می‌زند —
#    `SITE_URL`، `CORS_ORIGIN` و `NEXT_PUBLIC_API_URL` همه از آن
#    ساخته می‌شوند.  درست است، **وقتی زیردامنه‌ای در کار باشد**.
#
#    روی نصبی که فقط آی‌پی دارد، زیردامنه‌ای نیست: بلوکِ پایهٔ
#    `Caddyfile.subdomains` خودش آی‌پی را به محصولِ پیش‌فرض می‌دهد.
#    اگر آن‌جا هم `MOLIDO_HOST_STORE=<آی‌پی>` بگذاریم، Caddy دو بلوک
#    با یک نشانی می‌بیند و **کلِ پیکربندی را رد می‌کند**:
#    «ambiguous site definition».  آزموده شد.
#
#    پس این فایل فقط شبکه و نامِ مستعار را اضافه می‌کند و به هویتِ
#    فروشگاه دست نمی‌زند.  محصولِ دوم زیردامنه یا پورتِ خودش را
#    می‌گیرد؛ فروشگاه همان‌جا که بود می‌ماند.

services:
  backend:
    networks:
      molido_net: {}
      molido_edge:
        # ⚠️ نامِ مستعار اجباری است: هر دو پروژه سرویسی به نامِ
        #    `backend` دارند و روی شبکهٔ مشترک، `backend` به یکی از
        #    آن دو حل می‌شود — کدام‌یک، به ترتیبِ بالا آمدن بستگی دارد.
        aliases: [store-backend]

  web:
    networks:
      molido_net: {}
      molido_edge:
        aliases: [store-web]

networks:
  molido_edge:
    external: true
