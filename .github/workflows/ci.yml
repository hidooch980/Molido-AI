name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      # فعلاً غیرمسدودکننده — وضعیت فعلی lint روی کل کدبیس سنجیده نشده است.
      # پس از تمیزسازی، continue-on-error را بردارید تا گیت واقعی شود.
      - name: Lint
        run: npx eslint "{src,test}/**/*.ts"
        continue-on-error: true

      - name: Build
        run: npm run build

      # TODO: پوشش تست بسیار کم است (۲ فایل spec برای ۸۳ سرویس).
      # تا افزوده شدن تست‌ها، passWithNoTests لازم است.
      - name: Test
        run: npm test -- --passWithNoTests

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
