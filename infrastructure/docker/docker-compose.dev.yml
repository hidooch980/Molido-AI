# =====================================================================
# MOLIDO AI — local development infrastructure
#
# Data stores only. The API, the web app and the workers run on the host
# during development so that reload cycles stay fast.
#
#   pnpm infra:up      start
#   pnpm infra:down    stop
#   pnpm infra:reset   stop and destroy volumes
#
# Ports are offset (5433 / 6380) so this stack can coexist with the legacy
# Molido services defined in the repository-root docker-compose.yml.
# =====================================================================

name: molido-mvp

services:
  postgres:
    image: postgres:16-alpine
    container_name: molido-mvp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MVP_POSTGRES_USER:-molido}
      POSTGRES_PASSWORD: ${MVP_POSTGRES_PASSWORD:-molido_dev_password}
      POSTGRES_DB: ${MVP_POSTGRES_DB:-molido_mvp}
      # Scrypt password storage for the database role itself.
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=scram-sha-256'
    ports:
      # Bound to loopback: the database is never reachable from the network.
      - '127.0.0.1:${MVP_POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${MVP_POSTGRES_USER:-molido} -d ${MVP_POSTGRES_DB:-molido_mvp}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # Least privilege: the container needs no elevated capabilities.
    security_opt:
      - no-new-privileges:true
    networks:
      - molido_mvp

  redis:
    image: redis:7-alpine
    container_name: molido-mvp-redis
    restart: unless-stopped
    # Persistence on, so a queued AI task survives a restart.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 60 1000
      --maxmemory 256mb
      --maxmemory-policy noeviction
    ports:
      - '127.0.0.1:${MVP_REDIS_PORT:-6380}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - molido_mvp

volumes:
  postgres_data:
    name: molido_mvp_postgres_data
  redis_data:
    name: molido_mvp_redis_data

networks:
  molido_mvp:
    name: molido_mvp
    driver: bridge
