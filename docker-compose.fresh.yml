# نصب تازه برای آزمون — پورت و حجم جدا از سیستم اصلی.
#
# چرا جدا و نه پاک کردن حجم اصلی: تنها راه واقعیِ آزمودن «نصب روی سرور
# مشتری» شروع از دیتابیس خالی است، ولی این نباید به قیمت پاک شدن دادهٔ
# در حال استفاده تمام شود.  با نام پروژهٔ دیگر (`-p molido-fresh`) داکر
# حجم‌های تازه می‌سازد و دو نصب کنار هم بی‌تداخل بالا می‌آیند.
#
# اجرا:
#   docker compose -p molido-fresh -f docker-compose.yml -f docker-compose.store.yml -f docker-compose.fresh.yml up -d
#
# پاک کردن پس از آزمون (حجم‌ها هم می‌روند — عمداً، چون آزمایشی‌اند):
#   docker compose -p molido-fresh ... down -v

services:
  postgres:
    ports: []

  backend:
    # !reset لازم است: کامپوز فهرست ports را از فایل‌ها به هم می‌چسباند،
    # پس بدون آن نصب تازه هم ۳۰۰۰ را می‌خواهد و با نصب اصلی تصادم می‌کند.
    ports: !override
      - "3100:3000"

  web:
    ports: !override
      - "3102:3001"
    build:
      args:
        # آرگومان ساخت است نه متغیر اجرا: Next.js مقدار `NEXT_PUBLIC_*` را
        # داخل بسته‌ی مرورگر می‌پزد.  اگر اینجا نیاید، صفحه‌های نصبِ تازه
        # بی‌سروصدا به بک‌اندِ نصب اصلی وصل می‌شوند — بدون هیچ خطایی، و
        # آزمون «نصب از صفر» عملاً دروغ می‌شود.
        NEXT_PUBLIC_API_URL: http://localhost:3100

  n8n:
    ports: !override
      - "5779:5678"
