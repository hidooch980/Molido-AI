name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # تست دود و نگهبان drift به PostgreSQL واقعی نیاز دارند — تنها جایی که
    # SQL دست‌نویس واقعاً تجزیه و اجرا می‌شود.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: molido_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/molido_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --passWithNoTests

      - name: Migrate
        run: npm run db:migrate

      # اگر migration ستونی اضافه کند و schema.generated.ts به‌روز نشود،
      # BaseCrudService آن ستون را بی‌صدا دور می‌ریزد؛ اینجا شکست می‌خورد.
      - name: Schema drift guard
        run: npm run check:schema

      - name: Seed
        run: npm run seed

      - name: Smoke test
        run: npm run test:smoke

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
