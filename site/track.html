<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پیگیری سفارش | مولیدو</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/config.js"></script>
</head>
<body>

<div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

<header>
  <div class="wrap bar">
    <a class="brand" href="/"><span class="mark" aria-hidden="true">م</span><span>مولیدو</span></a>
    <nav><a class="btn btn-ghost" href="/">صفحهٔ اصلی</a></nav>
  </div>
</header>

<main class="wrap" style="padding:clamp(48px,9vw,110px) 0">
  <div class="card" style="max-width:560px;margin-inline:auto">
    <h2 style="text-align:start;margin:0 0 6px">پیگیری سفارش</h2>
    <p class="sub" style="text-align:start;margin-bottom:18px">
      کد رهگیری‌ای که هنگام خرید گرفتید را وارد کنید.
    </p>

    <form id="f" novalidate>
      <label class="f">کد رهگیری
        <input type="text" id="code" placeholder="MO-..." required>
      </label>
      <div style="margin-top:14px">
        <button class="btn btn-primary" type="submit">پیگیری</button>
      </div>
    </form>

    <div class="msg" id="msg" role="status"></div>
    <div id="out" style="display:none;margin-top:18px"></div>
  </div>
</main>

<footer><div class="wrap foot"><span>© مولیدو</span></div></footer>

<script>
'use strict';

var FA = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
function money(n) {
  return Math.round(Number(n) || 0).toString()
    .replace(/\B(?=(\d{3})+(?!\d))/g, '٬')
    .replace(/\d/g, function (d) { return FA[+d]; });
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function say(kind, text) {
  var m = document.getElementById('msg');
  m.className = 'msg show ' + kind;
  m.textContent = text;
}

var API = (window.MOLIDO_CONFIG && window.MOLIDO_CONFIG.apiBase) || '';

var LABEL = {
  PAID:      ['✓', 'پرداخت‌شده', 'var(--ok)'],
  PENDING:   ['⏳', 'در انتظار پرداخت', 'var(--warn)'],
  FAILED:    ['✕', 'ناموفق', 'var(--bad)'],
  CANCELLED: ['—', 'لغوشده', 'var(--muted)']
};

function render(d) {
  var s = LABEL[d.status] || ['?', d.status, 'var(--muted)'];
  var rows = (d.items || []).map(function (i) {
    return '<div style="display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)">' +
           '<span>' + esc(i.title) + '</span>' +
           '<span>' + money(i.priceIrr) + '</span></div>';
  }).join('');

  document.getElementById('out').style.display = 'block';
  document.getElementById('out').innerHTML =
    '<div style="text-align:center;margin-bottom:16px">' +
      '<div style="font-size:42px">' + s[0] + '</div>' +
      '<b style="color:' + s[2] + '">' + esc(s[1]) + '</b>' +
    '</div>' + rows +
    '<div style="display:flex;justify-content:space-between;gap:12px;padding:12px 0;font-weight:800">' +
      '<span>جمع</span><span>' + money(d.amountIrr) + ' ریال</span></div>' +
    (d.bankRef ? '<div style="display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:13.5px">' +
      '<span>پیگیری بانک</span><span style="font-family:ui-monospace,monospace">' + esc(d.bankRef) + '</span></div>' : '');
}

document.getElementById('f').addEventListener('submit', function (e) {
  e.preventDefault();
  var code = document.getElementById('code').value.trim();
  if (!code) return say('bad', 'کد رهگیری را وارد کنید.');
  if (!API) return say('bad', 'نشانی سرور تنظیم نشده است.');

  say('ok', 'در حال بررسی…');
  fetch(API + '/site/purchase/' + encodeURIComponent(code))
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      if (!d) {
        document.getElementById('out').style.display = 'none';
        return say('bad', 'سفارشی با این کد پیدا نشد.');
      }
      document.getElementById('msg').className = 'msg';
      render(d);
    })
    .catch(function () { say('bad', 'ارتباط با سرور برقرار نشد.'); });
});

// ⚠️ کدِ آخرین سفارش اگر ذخیره شده باشد، خودکار پر می‌شود — کاربری که
//    وسطِ پرداخت پنجره را بسته، دنبالِ کد نمی‌گردد.
(function () {
  var pre = new URLSearchParams(location.search).get('code');
  if (!pre) { try { pre = localStorage.getItem('molido_last_order'); } catch (_) {} }
  if (pre) {
    document.getElementById('code').value = pre;
    document.getElementById('f').dispatchEvent(new Event('submit'));
  }
})();
</script>
</body>
</html>
